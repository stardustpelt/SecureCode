services:
  - type: web
    name: securecode-service
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn securecode_web.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /api/health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CORS_ORIGINS
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
