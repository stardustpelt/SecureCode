name: CI

on:
  push:
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [securecode-backend, securecode-api]
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-test-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ${{ matrix.backend }}
      - name: Run Django tests
        run: python manage.py test
        working-directory: ${{ matrix.backend }}

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Bandit
        run: python -m pip install bandit==1.9.4
      - name: Scan Python code
        run: bandit -r securecode-backend securecode-api -x '*/tests.py'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: securecode-ui/package-lock.json
      - name: Install and build UI
        run: npm ci && npm run build
        working-directory: securecode-ui
