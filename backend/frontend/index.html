<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCode - Python Code Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(72, 149, 239, 0.3), transparent 50%);
            pointer-events: none;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(17, 25, 40, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.125);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            position: relative;
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .download-section {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.2) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }

        .download-section h3 {
            margin-bottom: 10px;
        }

        .download-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: all 0.3s;
            color: #e2e8f0;
        }
        
        textarea:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: rgba(30, 41, 59, 0.7);
        }
        
        .file-upload {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-upload-label {
            flex: 1;
            padding: 15px 30px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.3) 100%);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .file-upload-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4) 0%, rgba(5, 150, 105, 0.4) 100%);
        }
        
        .file-name {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 5px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-download {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.3) 100%);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-download:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4) 0%, rgba(5, 150, 105, 0.4) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        
        .btn-download:disabled {
            background: rgba(100, 100, 100, 0.3);
            border-color: rgba(100, 100, 100, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results {
            margin-top: 30px;
            padding: 25px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .results h2 {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
        }
        
        .report-output {
            width: 100%;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-height: 200px;
            white-space: pre-wrap;
            color: #e2e8f0;
        }
        
        .success {
            color: #10b981;
            font-weight: 600;
        }
        
        .error {
            color: #ef4444;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        nav {
            max-width: 1000px;
            margin: 0 auto 20px;
            background: rgba(17, 25, 40, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.125);
            border-radius: 15px;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            position: relative;
        }

        nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #667eea;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="docs.html">Doc</a>
    </nav>

    <div class="container">
        <h1>🛡️ SecureCode</h1>
        <p class="subtitle">Python Security & Code Quality Analyzer</p>
        
        <div class="form-group">
            <label for="code_input">Paste Your Python Code:</label>
            <textarea id="code_input" rows="12" placeholder="def hello_world():&#10;    print('Hello, World!')"></textarea>
        </div>
        
        <div class="form-group">
            <label for="code_file">Or Upload a Python File:</label>
            <div class="file-upload">
                <input type="file" id="code_file" accept=".py" onchange="displayFileName()">
                <label for="code_file" class="file-upload-label">📁 Choose Python File</label>
            </div>
            <div class="file-name" id="file-name"></div>
        </div>

        <p>Web UI scans one file at a time. Use the full CLI to scan entire project folders. Submitted code is not executed.</p>
        
        <div class="button-group">
            <button onclick="analyzeCode()" class="btn-analyze" id="analyzeBtn">🔍 Analyze Code</button>
            <button onclick="downloadReport()" class="btn-download" id="downloadBtn" disabled>📥 Download PDF Report</button>
        </div>
        
        <div id="results" style="display: none;"></div>
    </div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let currentReportId = null;

        function displayFileName() {
            const input = document.getElementById('code_file');
            const fileNameDiv = document.getElementById('file-name');
            if (input.files.length > 0) {
                fileNameDiv.textContent = '✓ Selected: ' + input.files[0].name;
            } else {
                fileNameDiv.textContent = '';
            }
        }

        async function analyzeCode() {
            const codeInput = document.getElementById('code_input').value;
            const fileInput = document.getElementById('code_file').files[0];
            const analyzeBtn = document.getElementById('analyzeBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultsDiv = document.getElementById('results');

            if (!codeInput && !fileInput) {
                alert('Please paste code or upload a file');
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '⏳ Analyzing...';
            currentReportId = null;
            downloadBtn.disabled = true;
            resultsDiv.innerHTML = '<div class="loading">Analyzing your code...</div>';
            resultsDiv.style.display = 'block';

            try {
                let response;

                if (fileInput) {
                    // Upload file
                    const formData = new FormData();
                    formData.append('file', fileInput);
                    response = await fetch(`${API_BASE}/analyze/`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // Send code as JSON
                    response = await fetch(`${API_BASE}/analyze/`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            code: codeInput,
                            filename: 'web_code'
                        })
                    });
                }

                const result = await response.json();
                currentReportId = result.report_id;
                displayResults(result);
                downloadBtn.disabled = !currentReportId;

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="results">
                        <h2 class="error">❌ Error</h2>
                        <div class="report-output">Failed to connect to API. Make sure the server is running:
python3 manage.py runserver 127.0.0.1:8000

Error: ${error.message}</div>
                    </div>
                `;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '🔍 Analyze Code';
            }
        }

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="results"><h2></h2><div class="report-output"></div></div>';
            const heading = resultsDiv.querySelector('h2');
            heading.className = result.has_errors ? 'error' : 'success';
            heading.textContent = result.has_errors
                ? `⚠️ Analysis Results - ${result.error_count} Finding(s) Found`
                : '✅ Analysis Results - No Findings';
            resultsDiv.querySelector('.report-output').textContent = result.report || '';
        }

        function downloadReport() {
            if (currentReportId) {
                window.location.href = `${API_BASE}/report/${currentReportId}/?download=true`;
            }
        }
    </script>
</body>
</html>
